org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# §6 — Kotlin incremental caches blow up on paths with spaces / non-ASCII.
# The trivial build-time hit is worth the predictable builds.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Jetifier only matters if a transitive dep still ships pre-AndroidX
# AARs. All our pins are AndroidX-native; leaving it off saves build
# time. Flip to true if a legacy SDK is ever added.
android.enableJetifier=false
android.experimental.enableNewResourceShrinker=true
